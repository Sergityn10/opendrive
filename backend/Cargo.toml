[workspace]
resolver = "3"
members = ["crates/opendrive-api", "crates/opendrive-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/opendrive/opendrive"

[workspace.dependencies]
opendrive-core = { path = "crates/opendrive-core" }

anyhow = "1.0.104"
thiserror = "2.0.21"
async-trait = "0.1.92"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
axum-extra = { version = "0.12.6", features = [
    "typed-header",
    "form",
    "query",
    "file-stream",
    "cookie",
    "cookie-signed",
    "middleware",
    "typed-routing",
] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = [
    "cors",
    "trace",
    "timeout",
    "request-id",
    "sensitive-headers",
    "limit",
    "compression-gzip",
    "set-header",
    "catch-panic",
    "util",
] }
tokio = { version = "1.54.0", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
http = "1.5.0"
http-body-util = "0.1.5"
bytes = "1.12.1"
futures-util = "0.3.34"

sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-aws-lc-rs",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "json",
    "derive",
] }

argon2 = "0.6.0"
rand = "0.10.3"
tower-sessions = { version = "0.15.0", features = ["axum-core"] }
tower-cookies = "0.11.0"
cookie = "0.18.2"
jsonwebtoken = "11.1.0"
totp-rs = { version = "6.0.0", features = ["qr"] }

utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "uuid", "macros"] }
utoipa-axum = "0.3.0"
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
time = "0.3.55"

clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"

cap-std = "4.0.3"
camino = "1.2.6"
sanitize-filename = "0.6.0"
tempfile = "3.27.0"
mime_guess = "2.0.5"
hex = "0.4.3"
sha2 = "0.11.1"
blake3 = "1.8.7"

# Miniaturas de imagen. `image` cubre los formatos habituales; WebP es el
# formato de salida de la cache.
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
    "tiff",
    "ico",
] }

# ---------------------------------------------------------------------------
# fileloft: implementacion del protocolo tus 1.0 en Rust.
#
# Se fija el commit `980a906a` (etiqueta v0.3.1) en lugar de la version
# publicada en crates.io (0.3.0): la 0.3.0 no incluye cinco correcciones
# del 2026-08-02, dos de ellas marcadas `fix(security)`.
# ---------------------------------------------------------------------------
fileloft-core = { git = "https://github.com/sound-systems/fileloft", rev = "980a906a" }
fileloft-store-fs = { git = "https://github.com/sound-systems/fileloft", rev = "980a906a" }
fileloft-axum = { git = "https://github.com/sound-systems/fileloft", rev = "980a906a" }

# Servidor WebDAV. `dav-server` es un fork de `webdav-handler` con soporte
# completo de PROPFIND, PROPPATCH y LOCK/UNLOCK, y con ejemplo de axum 0.8.
#
# Se activa `localfs` (y no `memfs`) porque el crate de `dav-server` solo
# ofrece la conversión de `std::io::Error` a su propio tipo de error cuando
# está activo alguno de los dos backends de sistema de archivos integrados.
dav-server = { version = "0.11.0", default-features = false, features = ["localfs"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# `panic = "abort"` queda desactivado a propósito: un pánico en una petición
# no debe tumbar el servidor entero.
