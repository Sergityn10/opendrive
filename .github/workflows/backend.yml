name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Formato, clippy y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Comprobar el formato
        run: cargo fmt --all --check
        working-directory: backend

      - name: Ejecutar clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        working-directory: backend

      - name: Ejecutar los tests
        run: cargo test --workspace
        working-directory: backend

  docker:
    name: Construir la imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir la imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: opendrive-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
