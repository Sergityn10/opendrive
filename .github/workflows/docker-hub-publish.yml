name: Publicar en Docker Hub

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Componente a compilar y subir"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - backend
          - frontend
      tag:
        description: "Etiqueta de la imagen (ej: latest, 1.0.0)"
        required: true
        default: "latest"
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Compilar y publicar imágenes
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determinar etiqueta
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/v}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Compilar y subir Backend
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'backend' }}
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/opendrive-backend:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/opendrive-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compilar y subir Frontend
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'frontend' }}
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/opendrive-frontend:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/opendrive-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
