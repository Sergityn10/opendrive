# OpenDrive — despliegue completo con Docker.
#
# Modo 1 (Acceso directo por IP, sin requerir DNS ni dominio):
#   docker compose up -d --build
#   -> Disponible inmediatamente en http://<IP_DE_TU_PORTATIL>:3000
#
# Modo 2 (Con dominio propio y certificado SSL automático Let's Encrypt):
#   docker compose --profile tls up -d
#   -> Disponible en https://${DOMAIN}

name: opendrive

services:
  # ---------------------------------------------------------------------------
  # Proxy inverso con TLS automático (opcional, para dominio público con HTTPS).
  # Para activarlo: docker compose --profile tls up -d
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificados de Let's Encrypt
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks: [opendrive]

  # ---------------------------------------------------------------------------
  # Servidor: API REST + endpoint tus + WebDAV.
  # ---------------------------------------------------------------------------
  backend:
    image: ${IMAGE_PREFIX:-${DOCKERHUB_USERNAME:-opendrive}}/opendrive-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OPENDRIVE_BIND: 0.0.0.0:8080
      OPENDRIVE_DATA_DIR: /data
      OPENDRIVE_PUBLIC_URL: ${OPENDRIVE_PUBLIC_URL:-http://localhost:${WEB_PORT:-3000}}
      OPENDRIVE_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@opendrive.local}
      OPENDRIVE_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?falta ADMIN_PASSWORD en el fichero .env}
      OPENDRIVE_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      OPENDRIVE_SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      OPENDRIVE_MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-0}
      OPENDRIVE_TUS_EXPIRY_HOURS: ${TUS_EXPIRY_HOURS:-24}
      OPENDRIVE_DEFAULT_QUOTA_BYTES: ${DEFAULT_QUOTA_BYTES:-0}
      OPENDRIVE_ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      RUST_LOG: ${RUST_LOG:-info}
      RUST_BACKTRACE: "1"
    volumes:
      # Los datos (blobs, staging, miniaturas) viven en el host y son legibles
      # desde fuera del contenedor.
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks: [opendrive]

  # ---------------------------------------------------------------------------
  # Frontend: Web UI (Google Drive SPA) servida por nginx.
  # Proxea automáticamente /api/ y /dav/ hacia el backend.
  # Acceso directo por IP: http://<IP_PORTATIL>:${WEB_PORT:-3000}
  # ---------------------------------------------------------------------------
  frontend:
    image: ${IMAGE_PREFIX:-${DOCKERHUB_USERNAME:-opendrive}}/opendrive-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 8080
    depends_on:
      backend:
        condition: service_healthy
    networks: [opendrive]

  # ---------------------------------------------------------------------------
  # Base de datos.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opendrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en el fichero .env}
      POSTGRES_DB: ${POSTGRES_DB:-opendrive}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opendrive} -d ${POSTGRES_DB:-opendrive}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [opendrive]

  # ---------------------------------------------------------------------------
  # Actualizador dinámico de DNS (opcional).
  # Útil si el router no tiene DDNS activo y la IP pública es dinámica.
  # Para activarlo:
  #   docker compose --profile ddns up -d
  # ---------------------------------------------------------------------------
  ddns-updater:
    image: qmcgaw/ddns-updater:v2
    container_name: opendrive-ddns
    restart: unless-stopped
    profiles: ["ddns"]
    environment:
      - PERIOD=5m
      - UPDATE_COOLDOWN_PERIOD=5m
      - PUBLICIP_FETCHERS=all
      - HTTP_TIMEOUT=10s
    volumes:
      - ./deploy/ddns:/updater/data
    networks: [opendrive]

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel (opcional).
  # Permite acceder desde fuera SIN abrir puertos en el router ni configurar DDNS.
  # Para activarlo:
  #   docker compose --profile tunnel up -d
  # ---------------------------------------------------------------------------
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: opendrive-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks: [opendrive]

networks:
  opendrive:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
